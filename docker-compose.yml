services:
  db:
    image: pgvector/pgvector:0.8.2-pg17
    environment:
      POSTGRES_DB: retrivai
      POSTGRES_USER: retrivai
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-retrivai}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5433:5432"
    healthcheck:
      test: ["CMD", "pg_isready", "-h", "127.0.0.1", "-U", "retrivai", "-d", "retrivai"]
      interval: 5s
      timeout: 3s
      retries: 12

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file:
      - .env
    environment:
      APP_ENV: development
      COOKIE_SECURE: "false"
      FRONTEND_URLS: http://localhost:3000,http://127.0.0.1:3000
      DATABASE_URL: ""
      PGHOST: db
      PGPORT: "5432"
      PGDATABASE: retrivai
      PGUSER: retrivai
      PGPASSWORD: ${POSTGRES_PASSWORD:-retrivai}
      HF_HOME: /app/data/hf_cache
    volumes:
      - ./data:/app/data
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8000
    ports:
      - "3000:3000"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  postgres-data:
